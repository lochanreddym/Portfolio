<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms detection</title>
  </head>
  <body>
    <!--
      Static form used so Netlify can detect the contact form during deploy.
      The real user-facing form lives at /contact.
    -->
    <form name="contact" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
